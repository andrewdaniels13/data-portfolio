AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Bellabeat pipeline: tagged VPC for EMR, two Lambdas (inventory,
  validation), IAM roles, and the Step Functions state machine.
  Nothing here bills while idle; EMR exists only during an execution.
  Deploy with `aws cloudformation package` first (uploads the Lambda
  code and the ASL to the bootstrap bucket).

Parameters:
  BucketName:
    Type: String
    Default: bellabeat-pipeline-drew
  PandasLayerArn:
    Type: String
    Description: AWS SDK for pandas layer (bundles pyarrow) for python3.13
    Default: arn:aws:lambda:us-east-1:336392948345:layer:AWSSDKPandas-Python313:16

Resources:
  # ---------- network: EMR managed policy v2 requires tagged resources ----------
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.20.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - { Key: Name, Value: bellabeat-emr }
        - { Key: for-use-with-amazon-emr-managed-policies, Value: "true" }

  InternetGateway:
    Type: AWS::EC2::InternetGateway

  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  Subnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.20.0.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags:
        - { Key: Name, Value: bellabeat-emr-public }
        - { Key: for-use-with-amazon-emr-managed-policies, Value: "true" }

  RouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc

  DefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties:
      RouteTableId: !Ref RouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  SubnetRouteAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref Subnet
      RouteTableId: !Ref RouteTable

  # ---------- Lambdas ----------
  LambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: read-bucket
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !Sub arn:aws:s3:::${BucketName}
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub arn:aws:s3:::${BucketName}/*

  InventoryFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: bellabeat-inventory
      Runtime: python3.13
      Handler: inventory_lambda.lambda_handler
      Code: ./
      MemorySize: 128
      Timeout: 30
      Role: !GetAtt LambdaRole.Arn

  ValidateFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: bellabeat-validate
      Runtime: python3.13
      Handler: validate_lambda.lambda_handler
      Code: ./
      MemorySize: 512
      Timeout: 120
      Layers:
        - !Ref PandasLayerArn
      Role: !GetAtt LambdaRole.Arn

  InventoryLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/bellabeat-inventory
      RetentionInDays: 14

  ValidateLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/bellabeat-validate
      RetentionInDays: 14

  # ---------- EMR roles ----------
  EmrServiceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: elasticmapreduce.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn: !Sub arn:aws:elasticmapreduce:${AWS::Region}:${AWS::AccountId}:*
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonEMRServicePolicy_v2
      Policies:
        # v2 only allows passing the default-named EC2 role; allow ours too
        - PolicyName: pass-ec2-role
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt EmrEc2Role.Arn
                Condition:
                  StringLike:
                    iam:PassedToService: ec2.amazonaws.com*

  EmrEc2Role:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: bucket-and-cluster-read
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:ListBucket
                  - s3:GetBucketLocation
                  - s3:ListBucketMultipartUploads
                Resource: !Sub arn:aws:s3:::${BucketName}
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:AbortMultipartUpload
                  - s3:ListMultipartUploadParts
                Resource: !Sub arn:aws:s3:::${BucketName}/*
              - Effect: Allow
                Action:
                  - elasticmapreduce:DescribeCluster
                  - elasticmapreduce:ListInstanceGroups
                  - elasticmapreduce:ListBootstrapActions
                  - ec2:DescribeTags
                  - ec2:DescribeInstances
                Resource: "*"

  EmrInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref EmrEc2Role

  # ---------- Step Functions ----------
  StateMachineRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: states.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: orchestrate
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource:
                  - !GetAtt InventoryFunction.Arn
                  - !GetAtt ValidateFunction.Arn
              - Effect: Allow
                Action:
                  - elasticmapreduce:RunJobFlow
                  - elasticmapreduce:DescribeCluster
                  - elasticmapreduce:TerminateJobFlows
                  - elasticmapreduce:AddJobFlowSteps
                  - elasticmapreduce:DescribeStep
                  - elasticmapreduce:CancelSteps
                  - elasticmapreduce:AddTags
                Resource: "*"
              - Effect: Allow
                Action: iam:PassRole
                Resource:
                  - !GetAtt EmrServiceRole.Arn
                  - !GetAtt EmrEc2Role.Arn
              - Effect: Allow
                Action: iam:CreateServiceLinkedRole
                Resource: "*"
                Condition:
                  StringLike:
                    iam:AWSServiceName: elasticmapreduce.amazonaws.com*
              - Effect: Allow
                Action:
                  - events:PutTargets
                  - events:PutRule
                  - events:DescribeRule
                Resource: !Sub arn:aws:events:${AWS::Region}:${AWS::AccountId}:rule/StepFunctionsGetEventForEMR*

  StateMachine:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      StateMachineName: bellabeat-pipeline
      StateMachineType: STANDARD
      RoleArn: !GetAtt StateMachineRole.Arn
      DefinitionS3Location: state_machine.json
      DefinitionSubstitutions:
        InventoryFunctionArn: !GetAtt InventoryFunction.Arn
        ValidateFunctionArn: !GetAtt ValidateFunction.Arn
        EmrServiceRole: !Ref EmrServiceRole
        EmrInstanceProfile: !Ref EmrInstanceProfile
        Ec2SubnetId: !Ref Subnet

Outputs:
  StateMachineArn:
    Value: !Ref StateMachine
  SubnetId:
    Value: !Ref Subnet
